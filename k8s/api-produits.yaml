apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-produits
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-produits
  template:
    metadata:
      labels:
        app: api-produits
    spec:
      containers:
      - name: api-produits
        image: api-produits:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-produits
spec:
  selector:
    app: api-produits
  ports:
  - port: 80
    targetPort: 5000