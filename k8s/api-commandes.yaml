apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-commandes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-commandes
  template:
    metadata:
      labels:
        app: api-commandes
    spec:
      containers:
      - name: api-commandes
        image: api-commandes:1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PRODUCT_URL
          value: "http://api-produits"
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-commandes
spec:
  selector:
    app: api-commandes
  ports:
  - port: 80
    targetPort: 5000